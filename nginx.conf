server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/manifest+json;

    # Old site URLs (/en, /fr) -> new canonical folders
    location = /en { return 301 /en/; }
    location = /fr { return 301 /fr/; }
    location = /v2 { return 301 /v2/; }
    location = /v3 { return 301 /v3/; }
    location = /v4 { return 301 /v4/; }
    location = /v5 { return 301 /v5/; }
    location = /v6 { return 301 /v6/; }
    location = /v7 { return 301 /v7/; }
    location = /v8 { return 301 /v8/; }
    location = /v9 { return 301 /v9/; }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
